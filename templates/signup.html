<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrafficCommand — Controller Sign Up</title>
  <meta name="description" content="Secure signup portal for authorised traffic controllers — AI Traffic Monitoring System." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/auth.css" />
</head>
<body>

  <!-- Animated background -->
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="particles" id="particles"></div>

  <!-- Auth card -->
  <main class="auth-wrapper" role="main">
    <div class="auth-card signup-card" id="authCard">

      <!-- Logo -->
      <div class="logo-ring" style="width: 60px; height: 60px; margin-bottom: 15px;">
        <div class="traffic-lights" style="gap: 3px;">
          <span class="light red" style="width: 10px; height: 10px;"></span>
          <span class="light amber" style="width: 10px; height: 10px;"></span>
          <span class="light green active" style="width: 10px; height: 10px;"></span>
        </div>
      </div>

      <!-- Header -->
      <h1 class="brand">TrafficCommand</h1>
      <p class="brand-sub">Traffic Controller Portal</p>

      <!-- ── SIGNUP PANEL ────────────────────────── -->
      <div class="panel active" id="panel-signup">
        <form id="signupForm" novalidate onsubmit="handleSignup(event)">

          <div class="field-row">
            <div class="field-group">
              <label for="signup-firstname">First Name</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                <input type="text" id="signup-firstname" name="firstname"
                       placeholder="First name" required />
              </div>
              <span class="field-error" id="signup-firstname-err"></span>
            </div>
            <div class="field-group">
              <label for="signup-lastname">Last Name</label>
              <div class="input-wrap">
                <input type="text" id="signup-lastname" name="lastname"
                       placeholder="Last name" required />
              </div>
              <span class="field-error" id="signup-lastname-err"></span>
            </div>
          </div>

          <div class="field-group">
            <label for="signup-badge">Badge / Officer ID</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="7" width="20" height="14" rx="2"/>
                <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                <line x1="12" y1="12" x2="12" y2="16"/>
                <line x1="10" y1="14" x2="14" y2="14"/>
              </svg>
              <input type="text" id="signup-badge" name="badge_id"
                     placeholder="e.g. TC-2024-001" required />
            </div>
            <span class="field-error" id="signup-badge-err"></span>
          </div>

          <div class="field-group">
            <label for="signup-email">Email Address</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              <input type="email" id="signup-email" name="email"
                     placeholder="officer@traffic.gov" required />
            </div>
            <span class="field-error" id="signup-email-err"></span>
          </div>

          <div class="field-group">
            <label for="signup-username">Username</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" id="signup-username" name="username"
                     placeholder="Choose a username" required />
            </div>
            <span class="field-error" id="signup-username-err"></span>
          </div>

          <div class="field-group">
            <label for="signup-password">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="signup-password" name="password"
                     placeholder="Min 8 chars, 1 number"
                     autocomplete="new-password" required
                     oninput="checkStrength(this.value)" />
              <button type="button" class="toggle-pw" onclick="togglePw('signup-password', this)"
                      aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="strength-bar">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <span class="strength-label" id="strengthLabel"></span>
            <span class="field-error" id="signup-password-err"></span>
          </div>

          <div class="field-group">
            <label for="signup-confirm">Confirm Password</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
              </svg>
              <input type="password" id="signup-confirm" name="confirm_password"
                     placeholder="Re-enter password"
                     autocomplete="new-password" required />
            </div>
            <span class="field-error" id="signup-confirm-err"></span>
          </div>

          <div class="form-extras">
            <label class="checkbox-wrap terms">
              <input type="checkbox" id="agree-terms" required />
              <span class="checkmark"></span>
              I agree to the <a href="#" class="link">Terms of Service</a>
            </label>
            <label class="checkbox-wrap admin-check">
              <input type="checkbox" id="signup-is-admin" />
              <span class="checkmark"></span>
              Register as Admin
            </label>
          </div>

          <button type="submit" class="btn-primary" id="signupBtn">
            <span class="btn-text">Create Account</span>
            <span class="btn-spinner" hidden></span>
          </button>

          <div class="alert" id="signup-alert" role="alert" hidden></div>
          
          <div class="auth-switch">
             Already have an account? <a href="/login" class="link">Login</a>
          </div>

        </form>
      </div>

      <!-- Footer -->
      <div class="secure-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Secure Portal &nbsp;|&nbsp; AES-256 Encrypted
      </div>
    </div>

    <!-- Version badge -->
    <p class="version-tag">AI Traffic Monitoring System &nbsp;v2.0</p>
  </main>

  <script src="/static/auth.js"></script>
</body>
</html>
