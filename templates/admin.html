<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrafficCommand — Admin Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="logo">
      <div class="logo-icon"></div>
      TrafficCommand <span class="badge">ADMIN</span>
    </div>
    
    <div class="status-indicators">
      <div class="status-item">
        <span class="status-dot green"></span>
        System Online
      </div>
    </div>
    
    <div class="user-controls">
      <a href="/" class="btn btn-outline" style="margin-right: 15px;">Dashboard</a>
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="dashboard-container">
    
    <div class="panel full-width">
      <div class="panel-header">
        <h2 class="panel-title">Controller Management</h2>
        <button class="btn btn-outline" onclick="loadUsers()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Refresh
        </button>
      </div>
      
      <div class="table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Badge ID</th>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr>
              <td colspan="9" style="text-align: center; padding: 30px; color: var(--text-muted);">
                Loading users...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Alert System -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/admin.js"></script>
</body>
</html>
