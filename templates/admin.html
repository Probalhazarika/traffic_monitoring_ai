<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrafficCommand — Admin Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>

  <!-- Animated background -->
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- ═══ HEADER ════════════════════════════════ -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-icon">🚦</span>
      <div>
        <h1 class="brand-title">TrafficCommand</h1>
        <span class="brand-sub">Controller Management Portal</span>
      </div>
    </div>
    <div class="topbar-meta">
      <a href="/" style="padding: 4px 10px; font-size: 0.75rem; font-weight: 600; color: #a78bfa; border: 1px solid rgba(167,139,250,0.4); border-radius: 4px; text-decoration: none; margin-right: 10px; transition: all 0.2s;">Dashboard</a>
      <a href="/logout" style="padding: 4px 10px; font-size: 0.75rem; font-weight: 600; color: #ef4444; border: 1px solid rgba(239,68,68,0.4); border-radius: 4px; text-decoration: none; margin-right: 10px; transition: all 0.2s;">Logout</a>
      <div class="meta-chip">System Online</div>
      <div class="status-dot online" title="System status"></div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="dashboard-container" style="padding-top: 100px;">
    
    <div class="panel full-width glass-panel">
      <div class="panel-header" style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px;">
        <div>
          <h2 class="panel-title" style="font-size: 1.5rem; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3);">Controller Management</h2>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">Approve, revoke, or delete access for traffic controllers.</p>
        </div>
        <button class="btn btn-outline btn-refresh" onclick="loadUsers()" style="border-color: var(--cyan); color: var(--cyan);">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Refresh Data
        </button>
      </div>
      
      <div class="table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Badge ID</th>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Joined</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr>
              <td colspan="9" style="text-align: center; padding: 40px; color: var(--cyan);">
                <div style="display: flex; justify-content: center; align-items: center; gap: 10px;">
                  <span style="display: inline-block; width: 16px; height: 16px; border: 2px solid var(--cyan); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></span>
                  Loading users...
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Alert System -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/admin.js"></script>
</body>
</html>
