<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrafficCommand — Controller Login</title>
  <meta name="description" content="Secure login portal for authorised traffic controllers — AI Traffic Monitoring System." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/auth.css" />
</head>
<body>

  <!-- Animated background -->
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="particles" id="particles"></div>

  <!-- Auth card -->
  <main class="auth-wrapper" role="main">
    <div class="auth-card" id="authCard">

      <!-- Logo -->
      <div class="logo-ring">
        <div class="traffic-lights">
          <span class="light red"></span>
          <span class="light amber"></span>
          <span class="light green active"></span>
        </div>
      </div>

      <!-- Header -->
      <h1 class="brand">TrafficCommand</h1>
      <p class="brand-sub">Traffic Controller Portal</p>

      <!-- ── LOGIN PANEL ─────────────────────────── -->
      <div class="panel active" id="panel-login">
        <form id="loginForm" novalidate onsubmit="handleLogin(event)">

          <div class="field-group">
            <label for="login-username">Username or Email</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" id="login-username" name="username"
                     placeholder="Enter your username"
                     autocomplete="username" required />
            </div>
            <span class="field-error" id="login-username-err"></span>
          </div>

          <div class="field-group">
            <label for="login-password">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="login-password" name="password"
                     placeholder="Enter your password"
                     autocomplete="current-password" required />
              <button type="button" class="toggle-pw" onclick="togglePw('login-password', this)"
                      aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="login-password-err"></span>
          </div>

          <div class="form-extras">
            <label class="checkbox-wrap">
              <input type="checkbox" id="remember-me" />
              <span class="checkmark"></span>
              Remember me
            </label>
            <label class="checkbox-wrap admin-check">
              <input type="checkbox" id="login-is-admin" />
              <span class="checkmark"></span>
              Login as Admin
            </label>
          </div>

          <button type="submit" class="btn-primary" id="loginBtn">
            <span class="btn-text">Login to Dashboard</span>
          </button>

          <div class="alert" id="login-alert" role="alert" hidden></div>
          
          <div class="auth-switch">
             Need an account? <a href="/signup" class="link">Sign Up</a>
          </div>

        </form>
      </div>

      <!-- Footer -->
      <div class="secure-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Secure Portal &nbsp;|&nbsp; AES-256 Encrypted
      </div>
    </div>

    <!-- Version badge -->
    <p class="version-tag">AI Traffic Monitoring System &nbsp;v2.0</p>
  </main>

  <script src="/static/auth.js"></script>
</body>
</html>
